services:
  - type: web
    name: salon-agent-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: THINK_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: USE_ELEVENLABS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: LANGFUSE_CAPTURE_USER_TEXT
        sync: false
      - key: GOOGLE_CALENDAR_SA_FILE
        sync: false
      - key: GOOGLE_CALENDAR_ST01
        sync: false
      - key: GOOGLE_CALENDAR_ST02
        sync: false
      - key: GOOGLE_CALENDAR_ST03
        sync: false
      - key: GOOGLE_CALENDAR_ST04
        sync: false

databases:
  - name: salon-agent-db
    plan: free
    region: oregon
    databaseName: salon
    postgresMajorVersion: "16"
    ipAllowList: []
